name: Build and publish SimpleInventories ver/1.0.x

on:
  push:
    branches: [ ver/1.0.x ]

concurrency: simpleinventories_1_0_x
jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVADOC: true
      GIT_COMMIT_MESSAGE: "${{ github.event.head_commit.message }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean checkLicenses build --stacktrace --warning-mode all
      - name: Publish with Gradle
        run: ./gradlew publish --stacktrace --warning-mode all
        env:
          NEXUS_URL_RELEASE: ${{ secrets.NEXUS_URL_RELEASE }}
          NEXUS_URL_SNAPSHOT: ${{ secrets.NEXUS_URL_SNAPSHOT }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}